<body style="background-color: lightpink;">
	<center><h1>Click the buttons to convert</h1>
	<kbd>100</kbd>
	<center><h2>PHP to either INR or CNY.</h2>



	<script type="text/javascript">
		let PHP = 100;

	</script>
	<br>

	<center><p id= "Rupee"> </p>

	<center><button type= "button" class="btn btn-success" onclick="let PHP = 100; let INR = 1.47; document.getElementById('Rupee').innerHTML= '<kbd>' + ( PHP * INR ) + '</kbd>';">Indian Rupee</button>

	<br>
	<br>

	<center><p id= "Yuan"> </p>

		<center><button type= "button" class="btn btn-success" onclick="let PHP = 100; let CNY = 0.13; document.getElementById('Yuan').innerHTML= '<kbd>' + ( PHP * CNY) + '</kbd>';">Chinese Yuan</button>

	<br>
	<br>
	<br>
